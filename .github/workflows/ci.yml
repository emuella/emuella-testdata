name: emuella-testdata CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p emuella-corpus -- check
      - run: cargo run -p emuella-corpus -- verify common/generated-core
      - run: ./scripts/check-generated.sh
      - run: python3 recipes/check-independent-nitf.py
      - run: python3 recipes/check-spacenet-psrgb16.py
      - run: cargo run -p emuella-corpus -- verify jpeg-2000/independent-nitf
