name: emuella-testdata CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale Rust test report before setup
        run: python3 scripts/test-rust.py --profile ci --prepare
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Install pinned Nextest binary
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
          checksum: true
          fallback: none
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check test runner contracts
        run: python3 scripts/check-test-runner.py
      - name: Test workspace and doctests
        run: python3 scripts/test-rust.py --profile ci
      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: .test-results/nextest/ci/junit.xml
          if-no-files-found: warn
      - run: cargo run -p emuella-corpus -- check
      - run: cargo run -p emuella-corpus -- verify common/generated-core
      - run: ./scripts/check-generated.sh
      - run: python3 recipes/check-independent-nitf.py
      - run: python3 recipes/check-spacenet-psrgb16.py
      - run: python3 recipes/check-spacenet-extract.py
      - run: cargo run -p emuella-corpus -- verify jpeg-2000/independent-nitf
